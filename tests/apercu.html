<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu du site EPS</title>
<!--
  Le site en plein ecran, avec le faux serveur du banc d'essai : on regarde un ecran sans se
  connecter et sans rien envoyer. ?classe=3e6 ouvre directement cette classe.
-->
<style>html,body{margin:0;height:100%;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="cadre" title="site en apercu"></iframe>
<script>
(async function () {
  const source = await fetch("../index.html", { cache: "no-store" }).then(r => r.text());
  const doc = document.getElementById("cadre").contentDocument;
  doc.open();
  doc.write(source.replace(/<head>/i, `<head><base href="../"><script src="tests/faux-serveur.js"><\/script>`));
  doc.close();
  const classe = new URLSearchParams(location.search).get("classe");
  if (!classe) return;
  const f = document.getElementById("cadre").contentWindow;
  for (let i = 0; i < 80; i++) {
    await new Promise(r => setTimeout(r, 150));
    if (typeof f.showTab !== "function") continue;
    f.showTab("classes");
    const puce = [...f.document.querySelectorAll("#importsList .classePuce")].find(b => b.textContent.startsWith(classe));
    if (puce) { puce.click(); break; }
  }
})();
</script>
</body>
</html>
